# El tile de la M (0x5A2) no esta libre: el bloque de 0x235A20 lleva dos fuentes solapadas, una fina
# (la A-Z de los nombres de la barra de vida) y otra mas gorda con otro mapeo, y ese hueco es la R de
# PRESS START. Como la fuente fina solo la usa la rutina de los nombres (el unico sitio de toda la ROM
# que hace tile = (letra - 'A') + 0x596, en 0x3D1196), se sacrifica una letra que no usa ningun nombre:
# se dibuja una M en el hueco de la Z (tile 0x5AF, ROM 0x235E80). Por eso en el fichero de textos los
# nombres se escriben con Z donde va una M: ENHER-ZAN y SAZSUNG salen en pantalla como ENHER-MAN y
# SAMSUNG. Quedan libres la B y la L por si hiciera falta la Q, la V, la W o la X, que estan igual.
# La fuente gorda de PUSH START vive en los huecos que la fina no usa (tile = byte + 0x555): la R en
# el hueco de la M, la U en el de la Q, la S en el de la V, la T en el de la W, la A en el de la X, y
# la H y la P justo detras de la Z. Solo hay esas siete letras, las de PUSH START y ninguna mas, asi
# que para poner PICA START se dibujan una I y una C gordas en los huecos de la B y la L de la fuente
# fina, que ningun nombre usa. La cadena de 0x3F2B26 no puede ir en el fichero de textos porque el
# .tbl es uno solo y 0x56 ya significa V; va aqui codificada a mano.
# PAUSE -> PAUSA: el unico texto nuevo de la v2-8, y no es texto sino cinco casillas de nametable en
# 0x3D1D70 con la fuente fina (tile = letra - 'A' + 0x596). Aqui se traduce por KIETO.
