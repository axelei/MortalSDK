minChars=4
# El byte 0x193E7 de la ROM base vale 0x01 (relleno sin usar, justo detras de la tabla de
# nombres de escenario de 0x1938D). Es un centinela: sin el, el volcador sigue leyendo
# caracteres imprimibles hasta 0x193EB y al inyectar el terminador de bloque machacaba el
# FF de move.w $FFAAC2,d2 en 0x193E8, con lo que la pantalla de meter el nombre cogia
# siempre el mando equivocado. No lo pongas a 0x20 ni a 0xFF (0xFF es el salto de linea).
textRanges=0,104624#1886010,1980942#2100000,2241116#2303868,2313415
bins=105472,107040
# Huecos libres (rachas de 0x00 de mas de 400 bytes) localizados escaneando la ROM original.
# Descartados los que caen dentro de un sample (extents de extracted/sample_*.wav), dentro de un
# bloque RNC, dentro de graficos sin comprimir o dentro de tablas dispersas. Los que quedan son
# el relleno entre el final de un sample y la etiqueta ASCII de 16 bytes del siguiente, mas el
# hueco previo al bloque RNC de 0x2F2050. Se recortan 16 bytes por cada extremo como margen.
# En decimal por defecto; con prefijo 0x/0X se leerian en hexadecimal.
# dispara: los 555 jsr a $1FADE2 (unica puerta al reproductor) cargan el id en d3 como
spaceRanges=1676368,1676768#1678864,1680208#2096680,2097120#2125206,2125792#2136094,2136736#2193988,2200528#2234932,2237120#2267090,2272576#2322832,2326608#2397976,2400112#2421160,2424800#2444564,2445280#2457948,2461744#2588688,2592992#2595204,2596832#2629632,2633696#2658102,2662384#2749232,2752480#2783984,2793440#2817296,2818016#2850688,2858976#2913046,2924512#3051616,3052528#3084756,3088448#3138316,3142080#3478704,3493856#3542316,3549296#3602056,3604448#4134332,4136928#4140018,4194272
# Paletas de las pantallas, sacadas del codigo que las carga (rutina de CRAM en 0x12C7A),
# mas la del escenario que rodea al bloque RNC 0x1959BC.
palettes=1959bc,19597a#255000,1a0000#1a15c0,1a0000#3664c0,1a04c0#1a9806,1a04c0#1a8234,2028e0#206670,209090#2e9410,2edb60#1a3b82,1a0020#346f20,34b700
# Pantallas comprobadas a ojo: mapa,graficos. El bloque 1a8234 lo comparten dos de ellas.
# El mapa 34ae30 no esta comprimido, va suelto en la ROM.
# Con "-" se descartan los mapas que el emparejado automatico une mal aunque cuadre el numero
# de tiles: 1ca6e0 con 2c4cb0, y 3f2000 con 1a73da.
scenes=2f2050,255000#1c8e90,1a15c0#3678e0,3664c0#1cbf08,1a9806#1c9dca,1a8234#1ca7a4,1a8234#34ae30,346f20#1ca6e0,-#3f2000,-
intro=charnego_introFinal.md
# El segundo tramo empieza en 0x3D1B50 porque v2-7 mete datos suyos de 0x3D0A00 a 0x3D1B3F.
introSpace=0x396000,0x3AFEFF#0x3D1B50,0x3EFEFF
# v2-7 llena 0x1C0-0x1EF de espacios en la cabecera, asi que ese hueco ya no vale.
codeSpace=0xd09a,0xd0d3#0xee02,0xee27#0xff8c,0xffa8
skipRoutines=0x19a70
romName=KOMBATE MORTAS ARCADA EDITION
# El parche se calcula contra la ROM original del juego en vez de contra la base de este hack, asi que
# el .ips se aplica sobre una ROM limpia de Mortal Kombat. Ruta relativa al directorio desde el que se
# lanza el SDK; si se pone absoluta hay que escribirla con barras normales, que en un .properties la
# barra invertida es un escape.
ipsBase=Mortal Kombat (USA, Europe) (Rev A) (Beta).md
