# Huecos donde se pueden poner trampolines de ocho bytes para desviar un lea cuyo texto se ha ido lejos.
# 0x1C0 son los bytes reservados de la cabecera de Mega Drive y 0xD09A es relleno entre dos rutinas.
codeSpace=0x1c0,0x1ef#0xd09a,0xd0d3
# Rutinas a las que se les pone un rts para que no hagan nada. 19a70 dibuja la pantalla del logo de
# Sega con los tiles de 19c00; solo se la llama desde el arranque, en 1273e, y se reserva y devuelve
# ella misma su pila, asi que saltarsela entera no deja nada a medias. Asi lo primero que se ve al
# encender o al resetear es la intro.
skipRoutines=0x19a70
# Campos de tamano fijo que salen al fichero de textos enteros y con su tamano exacto: el nombre
# nacional y el internacional de la cabecera de Mega Drive, 48 bytes cada uno. Ni se mueven ni se
# encadenan, y lo que sobre se rellena con espacios.
fixedTexts=0x120,0x14f#0x150,0x17f
# El nombre que se le pone a la ROM en los dos campos de la cabecera de Mega Drive, el nacional y el
# internacional. Se escribe lo ultimo de la inyeccion, asi que manda sobre lo que hayan puesto ahi los
# textos. Caben 48 caracteres.
romName=KOMBATE MORTAS ARCADA EDITION
